<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta de Clima Laboral — MASAMAMA</title>
<style>
  :root{
    --navy:#1F4E78;
    --navy-dark:#153a5a;
    --blue:#2E75B6;
    --bg:#F4F7FA;
    --card:#FFFFFF;
    --line:#D9E2EC;
    --text:#1B2733;
    --muted:#5C6B7A;
    --ok:#2E7D32;
    --warn:#B5471B;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:Arial, Helvetica, sans-serif; background:var(--bg); color:var(--text);
    display:flex; justify-content:center; padding:24px 12px;
  }
  .app{width:100%; max-width:640px;}
  .brandbar{
    background:var(--navy); color:#fff; border-radius:var(--radius) var(--radius) 0 0;
    padding:16px 22px; display:flex; align-items:center; gap:14px;
  }
  .brandbar .logo-badge{
    background:#fff; border-radius:10px; padding:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .brandbar .logo-badge img{height:44px; width:auto; display:block;}
  .brandbar .brand-text{min-width:0;}
  .brandbar h1{margin:0; font-size:19px; letter-spacing:.3px;}
  .brandbar p{margin:4px 0 0; font-size:12.5px; color:#cfe0ee;}
  .card{
    background:var(--card); border:1px solid var(--line); border-top:none;
    border-radius:0 0 var(--radius) var(--radius); padding:24px 22px 20px; min-height:320px;
  }
  .progress-wrap{padding:14px 22px 0;}
  .progress-track{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--blue); transition:width .3s ease;}
  .progress-label{font-size:11.5px; color:var(--muted); margin-top:6px; text-align:right;}
  h2.block-title{color:var(--navy); font-size:16px; margin:0 0 4px;}
  p.block-sub{color:var(--muted); font-size:13px; margin:0 0 18px;}
  .field{margin-bottom:18px;}
  label.field-label{display:block; font-size:13.5px; font-weight:bold; color:var(--navy-dark); margin-bottom:8px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; padding:8px 14px; border-radius:20px;
    font-size:13px; cursor:pointer; user-select:none; transition:.15s;
  }
  .chip:hover{border-color:var(--blue);}
  .chip.selected{background:var(--navy); border-color:var(--navy); color:#fff;}
  input[type=text]{
    width:100%; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:14px;
    font-family:inherit;
  }
  .question{
    border:1px solid var(--line); border-radius:10px; padding:14px 14px 12px; margin-bottom:12px; background:#FBFCFE;
  }
  .question p{margin:0 0 10px; font-size:14px; line-height:1.4;}
  .scale-row{display:flex; justify-content:space-between; gap:6px;}
  .scale-opt{flex:1; text-align:center;}
  .scale-opt input{display:none;}
  .scale-opt .dot{
    width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); margin:0 auto 4px;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:bold; color:var(--muted);
    cursor:pointer; transition:.15s;
  }
  .scale-opt .dot:hover{border-color:var(--blue);}
  .scale-opt input:checked + .dot{background:var(--navy); border-color:var(--navy); color:#fff;}
  .scale-opt .txt{font-size:9.5px; color:var(--muted); line-height:1.15; display:block;}
  .scale-legend{
    font-size:11.5px; color:var(--muted); background:#F0F5FA; border-radius:8px; padding:10px 12px; margin-bottom:16px;
  }
  textarea{
    width:100%; min-height:110px; padding:10px 12px; border:1.5px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:14px; resize:vertical;
  }
  .nav-row{display:flex; justify-content:space-between; margin-top:20px; gap:10px;}
  button{
    font-family:inherit; font-size:14px; padding:11px 20px; border-radius:8px; border:none; cursor:pointer;
    font-weight:bold;
  }
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-dark);}
  .btn-ghost{background:none; color:var(--navy); border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--navy);}
  .btn-primary:disabled{background:#9FB4C6; cursor:not-allowed;}
  .warning{color:var(--warn); font-size:12.5px; margin-top:8px; display:none;}
  .intro p{font-size:13.5px; line-height:1.6; color:var(--text);}
  .intro .meta{font-size:12.5px; color:var(--muted); margin-top:14px;}
  .thanks{text-align:center; padding:30px 10px;}
  .thanks .check{font-size:44px; color:var(--ok); margin-bottom:10px;}
  .thanks h2{color:var(--navy); margin-bottom:6px;}
  .thanks p{color:var(--muted); font-size:13.5px;}
  .admin-link{
    text-align:center; margin-top:14px; font-size:11.5px; color:var(--muted);
  }
  .admin-link a{color:var(--muted); cursor:pointer; text-decoration:underline;}

  /* Admin */
  .admin-overlay{
    position:fixed; inset:0; background:rgba(20,30,40,.55); display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:50;
  }
  .admin-modal{background:#fff; border-radius:var(--radius); padding:24px; max-width:340px; width:100%;}
  .admin-modal h3{margin:0 0 6px; color:var(--navy);}
  .admin-modal p{font-size:12.5px; color:var(--muted); margin:0 0 14px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .stat-box{background:#F0F5FA; border-radius:10px; padding:12px; text-align:center;}
  .stat-box .num{font-size:22px; font-weight:bold; color:var(--navy);}
  .stat-box .lbl{font-size:11px; color:var(--muted);}
  .bar-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12.5px;}
  .bar-row .lbl{width:150px; flex-shrink:0; color:var(--text);}
  .bar-track{flex:1; background:var(--line); border-radius:6px; height:14px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--blue);}
  .bar-val{width:34px; text-align:right; color:var(--muted); flex-shrink:0;}
  .comment-item{border-bottom:1px solid var(--line); padding:10px 0; font-size:13px;}
  .comment-item .tag{font-size:10.5px; color:#fff; background:var(--blue); border-radius:10px; padding:2px 8px; margin-right:6px;}
  .badge{background:var(--warn); color:#fff; font-size:10.5px; padding:2px 8px; border-radius:10px; margin-left:6px;}
  .section-title{color:var(--navy); font-size:14px; margin:20px 0 10px; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .admin-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .close-x{float:right; cursor:pointer; color:var(--muted); font-size:18px;}
</style>
</head>

// flat question list with global numbering + block index, built once
const QUESTIONS = [];
BLOCKS.forEach((b, bi) => b.qs.forEach((q, qi) => QUESTIONS.push({num: QUESTIONS.length+1, text:q, blockIndex:bi})));

let state = {
  page: 0, // 0=intro, 1=clasificacion, 2..8=blocks, 9=comentario, 10=gracias
  sede: null, area: "", tiempo: null, puesto: null,
  answers: {}, // qNum -> value
  comentario: ""
};

const TOTAL_PAGES = 2 + BLOCKS.length + 1; // intro handled separately from stepper count
const app = document.getElementById('app');

function chip(list, current, onSelect){
  return `<div class="chips">` + list.map(opt =>
    `<div class="chip ${current===opt?'selected':''}" data-val="${opt}">${opt}</div>`
  ).join('') + `</div>`;
}

function renderProgress(){
  // pages 1..(1+BLOCKS.length) count toward progress; page 0 and last pages excluded
  const stepPages = 1 + BLOCKS.length; // clasificacion + 7 blocks
  let current = state.page; // 1..7 within blocks, page1 = clasificacion
  let pct = 0;
  if(state.page >= 1 && state.page <= stepPages){
    pct = Math.round((state.page / (stepPages+1)) * 100);
  } else if(state.page > stepPages){
    pct = 95;
  }
  return `<div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${state.page>=1 && state.page<=stepPages ? 'Paso '+state.page+' de '+(stepPages+1) : ''}</div>
  </div>`;
}

function render(){
  let html = `<div class="brandbar">
    <div class="logo-badge"><img src="${LOGO_B64}" alt="MASAMAMA"></div>
    <div class="brand-text">
      <h1>MASAMAMA S.A.C.</h1>
      <p>Encuesta de Clima Laboral — Diagnóstico inicial (anónima y confidencial)</p>
    </div>
  </div>`;
  html += renderProgress();
  html += `<div class="card">${renderPage()}</div>`;
  if(state.page !== 10){
    html += `<div class="admin-link"><a id="adminOpen">Panel administrativo (solo RRHH)</a></div>`;
  }
  app.innerHTML = html;
  attachHandlers();
}

function renderPage(){
  const stepPages = 1 + BLOCKS.length;
  if(state.page === 0) return renderIntro();
  if(state.page === 1) return renderClasificacion();
  if(state.page >= 2 && state.page <= 1+BLOCKS.length) return renderBlock(state.page-2);
  if(state.page === stepPages+1) return renderComentario();
  if(state.page === 10) return renderThanks();
  return '';
}

function renderIntro(){
  return `<div class="intro">
    <h2 class="block-title">Estimado/a colaborador/a</h2>
    <p>Esta encuesta es completamente anónima y confidencial. No hay respuestas correctas ni incorrectas — solo queremos conocer tu percepción honesta sobre el ambiente de trabajo. Los resultados serán compartidos con todos los colaboradores y nos ayudarán a mejorar.</p>
    <p class="meta">Tiempo estimado: 10 a 15 minutos.</p>
    <div class="nav-row"><span></span><button class="btn-primary" id="startBtn">Comenzar</button></div>
  </div>`;
}

function renderClasificacion(){
  return `
    <h2 class="block-title">Datos de clasificación</h2>
    <p class="block-sub">Esta información es solo para analizar resultados por grupo — no identifica al trabajador.</p>
    <div class="field">
      <label class="field-label">Sede donde trabajo:</label>
      ${chip(SEDES, state.sede)}
    </div>
    <div class="field">
      <label class="field-label">Área o departamento:</label>
      <input type="text" id="areaInput" value="${state.area}" placeholder="Ej. Cocina, Almacén, Administración...">
    </div>
    <div class="field">
      <label class="field-label">Tiempo en la empresa:</label>
      ${chip(TIEMPOS, state.tiempo)}
    </div>
    <div class="field">
      <label class="field-label">Mi puesto es:</label>
      ${chip(PUESTOS, state.puesto)}
    </div>
    <div class="warning" id="clasifWarning">Por favor completa sede, tiempo en la empresa y puesto.</div>
    <div class="nav-row">
      <button class="btn-ghost" id="backBtn">Atrás</button>
      <button class="btn-primary" id="nextBtn">Siguiente</button>
    </div>`;
}

function renderBlock(blockIndex){
  const block = BLOCKS[blockIndex];
  const startNum = BLOCKS.slice(0, blockIndex).reduce((a,b)=>a+b.qs.length,0) + 1;
  let qHtml = '';
  block.qs.forEach((qText, i) => {
    const num = startNum + i;
    const currentVal = state.answers[num];
    qHtml += `<div class="question">
      <p>${num}. ${qText}</p>
      <div class="scale-row">
        ${SCALE.map(s => `
          <label class="scale-opt">
            <input type="radio" name="q${num}" value="${s.v}" ${currentVal===s.v?'checked':''} data-qnum="${num}">
            <div class="dot" data-radio="q${num}-${s.v}">${s.v}</div>
            <span class="txt">${s.t}</span>
          </label>`).join('')}
      </div>
    </div>`;
  });
  return `
    <h2 class="block-title">${block.title}</h2>
    <p class="block-sub">${block.sub}</p>
    <div class="scale-legend"><strong>Escala:</strong> 1 = Totalmente en desacuerdo &nbsp;·&nbsp; 5 = Totalmente de acuerdo</div>
    ${qHtml}
    <div class="warning" id="blockWarning">Por favor responde todas las preguntas de este bloque.</div>
    <div class="nav-row">
      <button class="btn-ghost" id="backBtn">Atrás</button>
      <button class="btn-primary" id="nextBtn">Siguiente</button>
    </div>`;
}

function renderComentario(){
  return `
    <h2 class="block-title">29. ¿Hay algo más que quieras compartir sobre cómo mejorar el ambiente de trabajo?</h2>
    <p class="block-sub">Respuesta opcional</p>
    <textarea id="comentarioInput" placeholder="Escribe aquí tus comentarios (opcional)...">${state.comentario}</textarea>
    <div class="nav-row">
      <button class="btn-ghost" id="backBtn">Atrás</button>
      <button class="btn-primary" id="submitBtn">Enviar encuesta</button>
    </div>`;
}

function renderThanks(){
  return `<div class="thanks">
    <div class="check">✓</div>
    <h2>¡Gracias por tu participación!</h2>
    <p>Tus respuestas son valiosas. Los resultados serán compartidos con toda la empresa.</p>
  </div>`;
}

function attachHandlers(){
  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.onclick = () => { state.page = 1; render(); };

  const backBtn = document.getElementById('backBtn');
  if(backBtn) backBtn.onclick = () => { state.page -= 1; render(); };

  const nextBtn = document.getElementById('nextBtn');
  if(nextBtn) nextBtn.onclick = () => {
    if(state.page === 1){
      if(!state.sede || !state.tiempo || !state.puesto){
        document.getElementById('clasifWarning').style.display = 'block';
        return;
      }
      state.area = document.getElementById('areaInput').value.trim();
      state.page += 1; render(); return;
    }
    if(state.page >= 2 && state.page <= 1+BLOCKS.length){
      const blockIndex = state.page - 2;
      const startNum = BLOCKS.slice(0, blockIndex).reduce((a,b)=>a+b.qs.length,0) + 1;
      const count = BLOCKS[blockIndex].qs.length;
      let allAnswered = true;
      for(let n = startNum; n < startNum+count; n++){
        if(!state.answers[n]) allAnswered = false;
      }
      if(!allAnswered){
        document.getElementById('blockWarning').style.display = 'block';
        return;
      }
      state.page += 1; render(); return;
    }
  };

  // chips
  document.querySelectorAll('.chip').forEach(chipEl => {
    chipEl.onclick = () => {
      const val = chipEl.getAttribute('data-val');
      const parent = chipEl.parentElement;
      const isSede = SEDES.includes(val);
      const isTiempo = TIEMPOS.includes(val);
      const isPuesto = PUESTOS.includes(val);
      if(isSede) state.sede = val;
      else if(isTiempo) state.tiempo = val;
      else if(isPuesto) state.puesto = val;
      parent.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      chipEl.classList.add('selected');
    };
  });

  // radios
  document.querySelectorAll('input[type=radio]').forEach(r => {
    r.onchange = () => {
      const qnum = parseInt(r.getAttribute('data-qnum'));
      state.answers[qnum] = parseInt(r.value);
      const warn = document.getElementById('blockWarning');
      if(warn) warn.style.display = 'none';
    };
  });

  const submitBtn = document.getElementById('submitBtn');
  if(submitBtn) submitBtn.onclick = async () => {
    state.comentario = document.getElementById('comentarioInput').value.trim();
    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando...';
    try{
      const response = {
        sede: state.sede, area: state.area, tiempo: state.tiempo, puesto: state.puesto,
        answers: state.answers, comentario: state.comentario
      };
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(response)
      });
      state.page = 10;
      render();
    }catch(e){
      submitBtn.disabled = false;
      submitBtn.textContent = 'Enviar encuesta';
      alert('No se pudo enviar la encuesta. Verifica tu conexión a internet e intenta de nuevo.');
    }
  };

  const adminOpen = document.getElementById('adminOpen');
  if(adminOpen) adminOpen.onclick = openAdminGate;
}

// ---------- ADMIN PANEL ----------
function openAdminGate(){
  const overlay = document.createElement('div');
  overlay.className = 'admin-overlay';
  overlay.innerHTML = `<div class="admin-modal">
    <h3>Panel administrativo</h3>
    <p>Ingresa el código de acceso de RRHH.</p>
    <input type="text" id="pinInput" placeholder="Código de acceso" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;">
    <div class="warning" id="pinWarning">Código incorrecto.</div>
    <div class="admin-actions">
      <button class="btn-ghost" id="pinCancel">Cancelar</button>
      <button class="btn-primary" id="pinSubmit">Ingresar</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('pinCancel').onclick = () => overlay.remove();
  document.getElementById('pinSubmit').onclick = () => {
    const val = document.getElementById('pinInput').value.trim();
    if(val === ADMIN_CODE){
      overlay.remove();
      showAdminPanel();
    } else {
      document.getElementById('pinWarning').style.display = 'block';
    }
  };
}

async function fetchAllResponses(){
  try{
    const res = await fetch(SCRIPT_URL, {method:'GET'});
    const data = await res.json();
    if(data && data.status === 'ok' && Array.isArray(data.responses)) return data.responses;
    return [];
  }catch(e){
    return null; // null signals a connection error, distinct from zero responses
  }
}

async function showAdminPanel(){
  const overlay = document.createElement('div');
  overlay.className = 'admin-overlay';
  overlay.innerHTML = `<div class="admin-modal" style="max-width:560px;max-height:85vh;overflow-y:auto;">
    <span class="close-x" id="adminClose">✕</span>
    <h3>Panel de resultados — RRHH</h3>
    <p id="adminLoading">Cargando respuestas desde la hoja de Google...</p>
    <div id="adminBody"></div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('adminClose').onclick = () => overlay.remove();

  const responses = await fetchAllResponses();
  document.getElementById('adminLoading').style.display = 'none';

  if(responses === null){
    document.getElementById('adminBody').innerHTML =
      `<p style="font-size:13px;color:var(--warn);">No se pudo conectar con la hoja de Google. Verifica tu conexión a internet e intenta de nuevo.</p>
       <div class="admin-actions"><button class="btn-ghost" id="refreshBtn">Reintentar</button></div>`;
    document.getElementById('refreshBtn').onclick = async () => { overlay.remove(); showAdminPanel(); };
    return;
  }

  // new-since-last-visit badge (guardado localmente en este navegador)
  let lastSeen = 0;
  try{ lastSeen = parseInt(localStorage.getItem('masamama_admin_last_seen') || '0') || 0; }catch(e){ lastSeen = 0; }
  const newCount = Math.max(0, responses.length - lastSeen);

  const bodyEl = document.getElementById('adminBody');
  bodyEl.innerHTML = renderAdminBody(responses, newCount);

  document.getElementById('refreshBtn').onclick = async () => { overlay.remove(); showAdminPanel(); };
  document.getElementById('exportBtn').onclick = () => exportCSV(responses);

  try{ localStorage.setItem('masamama_admin_last_seen', String(responses.length)); }catch(e){}
}

function renderAdminBody(responses, newCount){
  const total = responses.length;
  const bySede = {}; SEDES.forEach(s => bySede[s]=0);
  responses.forEach(r => { if(bySede[r.sede] !== undefined) bySede[r.sede]++; });

  // block averages
  const blockAverages = BLOCKS.map((b, bi) => {
    const startNum = BLOCKS.slice(0,bi).reduce((a,x)=>a+x.qs.length,0)+1;
    const count = b.qs.length;
    let sum=0, n=0;
    responses.forEach(r => {
      for(let q=startNum; q<startNum+count; q++){
        if(r.answers && r.answers[q]){ sum += r.answers[q]; n++; }
      }
    });
    return {title:b.title.replace(/^BLOQUE \d+ — /,''), avg: n? (sum/n) : 0};
  });

  const comments = responses.filter(r => r.comentario && r.comentario.length>0);

  let html = `<div class="stat-grid">
    <div class="stat-box"><div class="num">${total}</div><div class="lbl">Respuestas totales</div></div>
    <div class="stat-box"><div class="num">${newCount>0?'+'+newCount:'0'}</div><div class="lbl">Nuevas desde tu última revisión</div></div>
  </div>`;

  html += `<div class="section-title">Respuestas por sede</div>`;
  SEDES.forEach(s => {
    const pct = total? Math.round((bySede[s]/total)*100) : 0;
    html += `<div class="bar-row"><div class="lbl">${s}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-val">${bySede[s]}</div></div>`;
  });

  html += `<div class="section-title">Promedio por bloque (escala 1–5)</div>`;
  blockAverages.forEach(b => {
    const pct = (b.avg/5)*100;
    html += `<div class="bar-row"><div class="lbl">${b.title}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div><div class="bar-val">${b.avg.toFixed(1)}</div></div>`;
  });

  html += `<div class="section-title">Comentarios (${comments.length})</div>`;
  if(comments.length===0){
    html += `<p style="font-size:12.5px;color:var(--muted);">Aún no hay comentarios.</p>`;
  } else {
    comments.forEach(c => {
      html += `<div class="comment-item"><span class="tag">${c.sede||'—'}</span>${c.comentario}</div>`;
    });
  }

  html += `<div class="admin-actions">
    <button class="btn-ghost" id="refreshBtn">Actualizar</button>
    <button class="btn-primary" id="exportBtn">Descargar CSV</button>
  </div>`;

  return html;
}

function exportCSV(responses){
  const headers = ['sede','area','tiempo_en_empresa','puesto', ...QUESTIONS.map(q=>'p'+q.num), 'comentario','fecha_hora'];
  const rows = responses.map(r => {
    const row = [r.sede||'', (r.area||'').replace(/,/g,';'), r.tiempo||'', r.puesto||''];
    QUESTIONS.forEach(q => row.push(r.answers && r.answers[q.num] ? r.answers[q.num] : ''));
    row.push((r.comentario||'').replace(/[\r\n,]/g,' ').trim());
    row.push(r.submittedAt||'');
    return row.join(',');
  });
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'clima_laboral_respuestas.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

render();
</script>
